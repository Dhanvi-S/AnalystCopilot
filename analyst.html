<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analyst’s Copilot</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.4.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="mb-4 text-center">Analyst’s Copilot</h1>
    <div class="input-group mb-3">
      <input type="text" id="companyInput" class="form-control" placeholder="Enter company ticker or name" aria-label="Company">
      <button class="btn btn-primary" id="fetchBtn">Get Summary</button>
    </div>
    <div id="result" class="card d-none">
      <div class="card-body" id="summaryContent"></div>
    </div>
  </div>

  <script>
    document.getElementById('fetchBtn').addEventListener('click', async () => {
      const company = document.getElementById('companyInput').value.trim();
      if (!company) return;
      const btn = document.getElementById('fetchBtn');
      btn.disabled = true;
      btn.textContent = 'Loading...';
      const resultCard = document.getElementById('result');
      const content = document.getElementById('summaryContent');
      resultCard.classList.add('d-none');
      try {
        const response = await fetch('/api/summary?company=' + encodeURIComponent(company));
        if (!response.ok) throw new Error('Failed to fetch summary');
        const data = await response.json();
        content.textContent = data.summary;
        resultCard.classList.remove('d-none');
      } catch (err) {
        content.textContent = err.message;
        resultCard.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Get Summary';
      }
    });
  </script>
  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.4.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
